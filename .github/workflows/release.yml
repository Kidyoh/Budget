name: Release

# Builds the signed Android APKs, the Play Store App Bundle and the Figma
# design pack, then publishes them as a GitHub release. Runs when a version
# tag such as v1.3.3 is pushed, or by hand from the Actions tab: the run then
# creates the tag on the commit it built.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v1.3.3 (created if it doesn't exist)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Restore the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing. See RELEASING.md."; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build APKs and the App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release
          flutter build appbundle --release

      - name: Build the Figma pack
        run: |
          python3 -m pip install --quiet pillow
          python3 tool/build_figma_pack.py out/EventBudget-Figma-pack

      - name: Collect release files
        run: |
          mkdir -p dist
          v="${TAG#v}"
          apk=build/app/outputs/flutter-apk
          cp "$apk/app-arm64-v8a-release.apk"   "dist/EventBudget-$v-arm64.apk"
          cp "$apk/app-armeabi-v7a-release.apk" "dist/EventBudget-$v-armv7-older-phones.apk"
          cp "$apk/app-x86_64-release.apk"      "dist/EventBudget-$v-x86_64-emulators.apk"
          cp "$apk/app-release.apk"             "dist/EventBudget-$v-universal.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/EventBudget-$v-play.aab"
          cp out/EventBudget-Figma-pack.zip      dist/EventBudget-Figma-pack.zip
          cp "out/EventBudget-Figma-pack/boards/All screens - light.png" dist/All-screens-light.png
          cp "out/EventBudget-Figma-pack/boards/All screens - dark.png"  dist/All-screens-dark.png
          cp assets/brand/birr_icon.svg          dist/Birr-icon.svg
          cp assets/brand/birr_icon.png          dist/Birr-icon.png
          cp assets/brand/birr_icon_badge.png    dist/Birr-icon-lime-badge.png
          cp assets/brand/icon.png               dist/App-icon.png
          cp design/extras/birr_note_icon.png    dist/Birr-note-icon.png
          ls -la dist

      - name: Check the release key signed the builds
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "dist/EventBudget-${TAG#v}-universal.apk" | tee certs.txt
          keytool -printcert -jarfile "dist/EventBudget-${TAG#v}-play.aab" | tee -a certs.txt
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::A build is signed with the debug key."; exit 1
          fi

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Event Budget ${{ env.TAG }}
          body_path: docs/releases/${{ env.TAG }}.md
          files: dist/*
          fail_on_unmatched_files: true
