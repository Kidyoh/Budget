name: Release

# Builds the Android APKs and the Figma design pack, then publishes them as a
# GitHub release. Runs when a version tag such as v1.3.3 is pushed, or by hand
# from the Actions tab for an existing tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v1.3.3
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build APKs
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Build the Figma pack
        run: |
          python3 -m pip install --quiet pillow
          python3 tool/build_figma_pack.py out/EventBudget-Figma-pack

      - name: Collect release files
        run: |
          mkdir -p dist
          v="${TAG#v}"
          apk=build/app/outputs/flutter-apk
          cp "$apk/app-arm64-v8a-release.apk"   "dist/EventBudget-$v-arm64.apk"
          cp "$apk/app-armeabi-v7a-release.apk" "dist/EventBudget-$v-armv7-older-phones.apk"
          cp "$apk/app-x86_64-release.apk"      "dist/EventBudget-$v-x86_64-emulators.apk"
          cp "$apk/app-release.apk"             "dist/EventBudget-$v-universal.apk"
          cp out/EventBudget-Figma-pack.zip      dist/EventBudget-Figma-pack.zip
          cp "out/EventBudget-Figma-pack/boards/All screens - light.png" dist/All-screens-light.png
          cp "out/EventBudget-Figma-pack/boards/All screens - dark.png"  dist/All-screens-dark.png
          cp assets/brand/birr_icon.svg          dist/Birr-icon.svg
          cp assets/brand/birr_icon.png          dist/Birr-icon.png
          cp assets/brand/birr_icon_badge.png    dist/Birr-icon-lime-badge.png
          cp assets/brand/icon.png               dist/App-icon.png
          cp design/extras/birr_note_icon.png    dist/Birr-note-icon.png
          ls -la dist

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Event Budget ${{ env.TAG }}
          body_path: docs/releases/${{ env.TAG }}.md
          files: dist/*
          fail_on_unmatched_files: true
